[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-code"
version = "0.1.0"
description = "Local-first codebase explainer: index a repo, map it, ask questions with citations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Surya Geethan" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pathspec>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tree-sitter>=0.25; python_version < '3.15'",
    "tree-sitter-javascript>=0.23; python_version < '3.15'",
    "tree-sitter-typescript>=0.23; python_version < '3.15'",
    "tree-sitter-go>=0.23; python_version < '3.15'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["web_static/*.html", "web_static/*.css", "web_static/*.js", "web_static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
